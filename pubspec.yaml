name: ratings_plus
description: A fully customizable rating bar for Flutter. Supports fractional ratings, custom shapes, gestures, forms, and global theming.
version: 2.0.1
repository: https://github.com/omar-hanafy/ratings_plus
issue_tracker: https://github.com/omar-hanafy/ratings_plus/issues

topics:
  - rating
  - star-rating
  - widgets
  - form

screenshots:
  - description: 'Ratings Plus interactive gallery featuring fractional stars, custom mood builders, outlined hearts, and scaled scores.'
    path: doc/screenshots/hero-light.png
  - description: 'Interactive Playground with live RatingBar preview, property controls, and generated Dart snippet.'
    path: doc/screenshots/playground.png
  - description: 'Read-only review summary, validated RatingBar.form card, vertical meters, custom gradient widgets, and RTL clipping.'
    path: doc/screenshots/reviews-and-layouts.png
  - description: 'Dark mode showcase powered by RatingBarThemeData.'
    path: doc/screenshots/dark-mode.png
  - description: 'Native right-to-left (RTL) directionality and fractional clipping showcase.'
    path: doc/screenshots/rtl-showcase.png

environment:
  sdk: ^3.10.4
  flutter: ">=3.38.5"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  material_ui: '>=0.0.1 <2.0.0'

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
